<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>차량 QR 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1a9e6e;
    --green-dark: #0d7a53;
    --green-light: #e8f8f2;
    --text: #1a1a1a;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --bg: #f9fafb;
    --white: #ffffff;
    --radius: 16px;
    --radius-sm: 10px;
  }
  html, body {
    min-height: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: 64px; height: 64px;
    background: var(--green-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.2rem;
  }
  .logo svg { width: 34px; height: 34px; color: var(--green); }
  h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.3rem; }
  .sub { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 2rem; text-align: center; line-height: 1.6; }

  .card {
    width: 100%;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 1.2rem;
  }
  .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
  .card h2 svg { width: 18px; height: 18px; color: var(--green); }

  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text-sub); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 0.72rem 0.9rem;
    font-family: inherit; font-size: 1rem;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }
  .field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(26,158,110,0.15); }

  .btn-green {
    width: 100%; padding: 0.85rem;
    background: var(--green); color: #fff;
    border: none; border-radius: var(--radius-sm);
    font-family: inherit; font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
    margin-top: 0.2rem;
  }
  .btn-green:hover { background: var(--green-dark); }
  .btn-green:active { transform: scale(0.98); }
  .btn-green:disabled { background: #9ca3af; cursor: not-allowed; }

  .tip {
    background: #fffbeb; border: 1px solid #fde68a;
    border-radius: var(--radius-sm);
    padding: 0.85rem 1rem;
    font-size: 0.82rem; color: #92400e; line-height: 1.7;
  }
  .tip strong { color: #78350f; }

  /* QR 결과 */
  #qr-section { display: none; width: 100%; }
  .qr-card {
    width: 100%;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
  }
  .qr-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 0.3rem; }
  .qr-card p { font-size: 0.83rem; color: var(--text-sub); margin-bottom: 1.2rem; line-height: 1.6; }
  #qr-box {
    display: inline-flex; padding: 14px;
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    margin-bottom: 1.2rem;
  }
  .qr-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-outline {
    padding: 0.6rem 1.1rem;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--white); color: var(--text);
    font-family: inherit; font-size: 0.88rem; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: background 0.12s;
  }
  .btn-outline:hover { background: var(--bg); }
  .btn-outline.primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-outline.primary:hover { background: var(--green-dark); }
  .btn-outline svg { width: 15px; height: 15px; }

  .url-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 0.7rem 1rem;
    font-size: 0.8rem; color: var(--text-sub);
    word-break: break-all; text-align: left; margin-top: 1rem;
  }
  .url-box span { display: block; font-size: 0.75rem; color: #9ca3af; margin-bottom: 4px; }

  .saved-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--green-light); color: var(--green-dark);
    font-size: 0.8rem; font-weight: 500;
    padding: 0.4rem 0.9rem; border-radius: 999px; margin-bottom: 1rem;
  }
  .saved-badge svg { width: 14px; height: 14px; }

  @media print {
    .wrap > *:not(#qr-section) { display: none !important; }
    #qr-section { display: block !important; }
    .qr-actions, .url-box { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <path d="M14 14h2v2h-2zm3 0h2v2h-2zm-3 3h2v2h-2zm3 3h2v2h-2zm0-6h2v2h-2z"/>
    </svg>
  </div>
  <h1>차량 QR 관리</h1>
  <p class="sub">안심번호와 이름을 등록하면<br>차량에 부착할 QR 코드가 생성됩니다.</p>

  <!-- 설정 카드 -->
  <div class="card" id="setup-card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      번호 등록
    </h2>
    <div class="field">
      <label for="input-name">표시 이름 <span style="font-weight:400;color:#9ca3af">(선택)</span></label>
      <input id="input-name" type="text" placeholder="예: 홍길동 차량" maxlength="20" autocomplete="off">
    </div>
    <div class="field">
      <label for="input-phone">안심번호</label>
      <input id="input-phone" type="tel" placeholder="050-XXXX-XXXX" maxlength="14" oninput="formatPhone(this)" inputmode="tel">
    </div>
    <input id="input-page" type="hidden" value="https://minkyukim9898.github.io/car-qr/">
    <button class="btn-green" onclick="generate()">QR 코드 생성</button>

    <div class="tip" style="margin-top:1rem">
      <strong>💡 안심번호란?</strong><br>
      KT · SKT · LGU+ 고객센터에서 신청 가능 (월 약 1,100원)<br>
      실제 번호가 상대방에게 노출되지 않습니다.
    </div>
  </div>

  <!-- QR 결과 -->
  <div id="qr-section">
    <div class="qr-card">
      <div class="saved-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        QR 생성 완료
      </div>
      <h2>차량에 부착할 QR 코드</h2>
      <p>아래 QR을 스캔하면 전화 / 문자 선택 화면이 나타납니다.<br>인쇄 후 차량 앞 유리에 부착하세요.</p>
      <div id="qr-box"></div>
      <div class="qr-actions">
        <button class="btn-outline primary" onclick="window.print()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          인쇄
        </button>
        <button class="btn-outline" onclick="downloadQR()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          이미지 저장
        </button>
        <button class="btn-outline" onclick="resetForm()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5.1L1 10"/></svg>
          다시 설정
        </button>
      </div>
      <div class="url-box" id="qr-url-box">
        <span>QR 연결 주소</span>
        <span id="qr-url-text"></span>
      </div>
    </div>
  </div>

</div>

<script>
  function formatPhone(el) {
    let v = el.value.replace(/\D/g, '');
    if (v.startsWith('050')) {
      if (v.length <= 4)      el.value = v;
      else if (v.length <= 8) el.value = v.slice(0,4) + '-' + v.slice(4);
      else                    el.value = v.slice(0,4) + '-' + v.slice(4,8) + '-' + v.slice(8,12);
    } else {
      if (v.length <= 3)      el.value = v;
      else if (v.length <= 7) el.value = v.slice(0,3) + '-' + v.slice(3);
      else                    el.value = v.slice(0,3) + '-' + v.slice(3,7) + '-' + v.slice(7,11);
    }
  }

  function generate() {
    const phone = document.getElementById('input-phone').value.trim();
    const name  = document.getElementById('input-name').value.trim();
    let   page  = document.getElementById('input-page').value.trim();

    if (!phone) { alert('안심번호를 입력해주세요.'); return; }
    if (!page)  { alert('연락 페이지 주소를 입력해주세요.\n예: https://아이디.github.io/car-qr/'); return; }
    if (!page.endsWith('/')) page += '/';

    const qrUrl = page + '?p=' + encodeURIComponent(phone.replace(/-/g,''))
                       + (name ? '&n=' + encodeURIComponent(name) : '');

    // QR 생성
    const box = document.getElementById('qr-box');
    box.innerHTML = '';
    new QRCode(box, {
      text: qrUrl,
      width: 220, height: 220,
      colorDark: '#1a1a1a', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    document.getElementById('qr-url-text').textContent = qrUrl;
    document.getElementById('setup-card').style.display = 'none';
    document.getElementById('qr-section').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function downloadQR() {
    const canvas = document.querySelector('#qr-box canvas');
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = 'car-qr.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function resetForm() {
    document.getElementById('setup-card').style.display = 'block';
    document.getElementById('qr-section').style.display = 'none';
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
