<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>차량 연락하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1a9e6e;
    --green-dark: #0d7a53;
    --green-light: #e8f8f2;
    --text: #1a1a1a;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --bg: #f9fafb;
    --white: #ffffff;
    --radius: 16px;
    --radius-sm: 10px;
  }
  html, body {
    height: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 메인 화면 ── */
  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2rem 1.5rem;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .car-wrap {
    width: 88px; height: 88px;
    background: var(--green-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.5rem;
  }
  .car-wrap svg { width: 46px; height: 46px; color: var(--green); }

  .main-title {
    font-size: 1.35rem; font-weight: 700;
    text-align: center; margin-bottom: 0.35rem; line-height: 1.4;
  }
  .main-sub {
    font-size: 0.875rem; color: var(--text-sub);
    text-align: center; margin-bottom: 2.5rem;
  }

  .btn-group {
    width: 100%; max-width: 340px;
    display: flex; flex-direction: column; gap: 0.85rem;
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 1.1rem 1.5rem;
    border-radius: var(--radius); border: none;
    font-family: inherit; font-size: 1.05rem; font-weight: 700;
    cursor: pointer; text-decoration: none;
    transition: transform 0.12s, box-shadow 0.12s;
    -webkit-user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn-call {
    background: var(--green); color: #fff;
    box-shadow: 0 4px 18px rgba(26,158,110,0.28);
  }
  .btn-call:hover { background: var(--green-dark); }
  .btn-sms {
    background: var(--white); color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-sms:hover { border-color: #c0c7d0; background: #f5f6f8; }
  .btn svg { width: 22px; height: 22px; flex-shrink: 0; }

  .divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-sub); font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .badge {
    margin-top: 2rem;
    background: var(--green-light); color: var(--green-dark);
    font-size: 0.78rem; font-weight: 500;
    padding: 0.45rem 1rem; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .badge svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* ── 오류 화면 ── */
  .error-screen {
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 2rem 1.5rem; text-align: center;
  }
  .error-screen.show { display: flex; }
  .screen.hide { display: none; }

  .error-icon {
    width: 72px; height: 72px;
    background: #fef2f2; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.2rem;
  }
  .error-icon svg { width: 36px; height: 36px; color: #ef4444; }
  .error-screen h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; }
  .error-screen p { font-size: 0.875rem; color: var(--text-sub); line-height: 1.7; }
</style>
</head>
<body>

<!-- 메인 연락 화면 -->
<main id="screen-main" class="screen" role="main">
  <div class="car-wrap" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 17H3a1 1 0 0 1-1-1v-4l2.45-4.9A2 2 0 0 1 6.24 6h11.52a2 2 0 0 1 1.79 1.1L22 12v4a1 1 0 0 1-1 1h-2"/>
      <circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/>
      <line x1="10" y1="17.5" x2="14" y2="17.5"/>
    </svg>
  </div>

  <h1 class="main-title" id="main-title">이 차량 차주에게<br>연락하기</h1>
  <p class="main-sub">아래 버튼을 눌러 바로 연락하세요</p>

  <div class="btn-group">
    <a id="btn-call" href="#" class="btn btn-call" onclick="doCall(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.45 2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l1.12-.93a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      전화 걸기
    </a>

    <div class="divider">또는</div>

    <a id="btn-sms" href="#" class="btn btn-sms" onclick="doSms(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      문자 보내기
    </a>
  </div>

  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    안심번호로 연결 · 실제 번호 비공개
  </div>
</main>

<!-- 번호 미등록 오류 화면 -->
<div id="screen-error" class="error-screen" role="alert">
  <div class="error-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </div>
  <h2>연락처가 등록되지 않았습니다</h2>
  <p>QR 코드가 올바르게 설정되지 않았습니다.<br>차주에게 QR 코드 재설정을 요청해주세요.</p>
</div>

<script>
  let currentPhone = '';
  let currentName  = '';

  (function init() {
    const params = new URLSearchParams(location.search);
    const p = params.get('p');
    const n = params.get('n');

    if (!p) {
      // 번호 파라미터 없으면 오류 화면
      document.getElementById('screen-main').classList.add('hide');
      document.getElementById('screen-error').classList.add('show');
      return;
    }

    currentPhone = p;
    currentName  = n ? decodeURIComponent(n) : '';

    if (currentName) {
      document.getElementById('main-title').innerHTML = currentName + '<br>차주에게 연락하기';
    }
  })();

  function doCall(e) {
    e.preventDefault();
    location.href = 'tel:' + currentPhone;
  }

  function doSms(e) {
    e.preventDefault();
    location.href = 'sms:' + currentPhone;
  }
</script>
</body>
</html>
